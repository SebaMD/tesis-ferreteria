services:
  db:
    image: postgres:16-alpine
    container_name: ferreteria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Seba.2005}
      POSTGRES_DB: ${POSTGRES_DB:-ferreteria}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - backend_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ferreteria}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        - NODE_ENV=${NODE_ENV:-production}
    container_name: ferreteria-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-Seba.2005}
      DATABASE: ${POSTGRES_DB:-ferreteria}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-super_secret}
      COOKIE_KEY: ${COOKIE_KEY:-cookie_key}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - product_uploads:/app/uploads
    networks:
      - backend_network
      - frontend_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    container_name: ferreteria-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Seba.2005}@db:5432/${POSTGRES_DB:-ferreteria}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    networks:
      - backend_network

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    container_name: ferreteria-seed
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Seba.2005}@db:5432/${POSTGRES_DB:-ferreteria}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - if [ "$${SEED_DEMO_DATA}" = "true" ]; then npm run db:seed; else echo "Seed de demostracion deshabilitado"; fi
    networks:
      - backend_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ferreteria-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - frontend_network

  python:
    build:
      context: ./python
      dockerfile: Dockerfile
      target: production
    container_name: ferreteria-python
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge

volumes:
  postgres_data:
  product_uploads:
