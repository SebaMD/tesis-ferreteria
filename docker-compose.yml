services:
  db:
    image: postgres:16-alpine
    container_name: ferreteria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definido}
      POSTGRES_DB: ${POSTGRES_DB:-ferreteria}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - backend_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ferreteria}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ferreteria-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definido}
      DATABASE: ${POSTGRES_DB:-ferreteria}
      # Puerto interno fijo: coincide con Nginx y el healthcheck.
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      UPLOADS_ROOT: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe estar definido}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET debe estar definido}
      LOGISTICS_QR_SECRET: ${LOGISTICS_QR_SECRET:?LOGISTICS_QR_SECRET debe estar definido}
      WEBPAY_ENVIRONMENT: ${WEBPAY_ENVIRONMENT:-integration}
      WEBPAY_COMMERCE_CODE: ${WEBPAY_COMMERCE_CODE:-}
      WEBPAY_API_KEY: ${WEBPAY_API_KEY:-}
      WEBPAY_RETURN_URL: ${WEBPAY_RETURN_URL:-http://localhost:3000/api/online-orders/payments/webpay/return}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      WEBPAY_TIMEOUT_MS: ${WEBPAY_TIMEOUT_MS:-30000}
      ONLINE_ORDER_RESERVATION_MINUTES: ${ONLINE_ORDER_RESERVATION_MINUTES:-20}
      GUEST_ORDER_ACCESS_DAYS: ${GUEST_ORDER_ACCESS_DAYS:-180}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - product_uploads:/app/uploads
    networks:
      - backend_network
      - frontend_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    container_name: ferreteria-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definido}@db:5432/${POSTGRES_DB:-ferreteria}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    networks:
      - backend_network

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    container_name: ferreteria-seed
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definido}@db:5432/${POSTGRES_DB:-ferreteria}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - if [ "$${SEED_DEMO_DATA}" = "true" ]; then npm run db:seed; else echo "Seed de demostracion deshabilitado"; fi
    networks:
      - backend_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: ferreteria-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - frontend_network

networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge

volumes:
  postgres_data:
  product_uploads:
